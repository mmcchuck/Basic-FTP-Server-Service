name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Windows-only by design: the server uses DPAPI, Windows ACLs, the SCM and WinForms.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BasicFtpServer.slnx

      - name: Build
        run: dotnet build BasicFtpServer.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test tests/BasicFtpServer.Tests/BasicFtpServer.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Publish self-contained
        run: >
          dotnet publish src/BasicFtpServer.App/BasicFtpServer.App.csproj
          -c Release -r win-x64 --self-contained true -o publish --nologo

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: BasicFtpServer-win-x64
          path: publish/
